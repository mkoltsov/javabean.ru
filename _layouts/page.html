---
layout: default
post_class: post-template page-template
---

<div class="jb-app jb-app-post">
  <nav class="jb-rail" aria-label="Primary navigation">
    <a class="jb-logo" href="{{ "/" | relative_url }}">JB</a>
    <a href="{{ "/" | relative_url }}">Home</a>
    <a class="active" href="{{ page.url | relative_url }}">{{ page.title }}</a>
    <a href="{{ "/feed.xml" | relative_url }}">RSS</a>
  </nav>

  {% include profile-sidebar.html %}

  <main class="jb-main">
    <header class="jb-topbar">
      <div class="jb-title">
        <a href="{{ "/" | relative_url }}">{{ site.name }}</a>
        <small>{{ site.description }}</small>
      </div>
      <nav class="jb-nav" aria-label="Top navigation">
        <a href="{{ "/" | relative_url }}">Home</a>
        <a href="{{ "/feed.xml" | relative_url }}">RSS</a>
      </nav>
    </header>

    <article class="jb-article">
      <header class="jb-article-header">
        <h1>{{ page.title }}</h1>
      </header>
      <section class="jb-post-content">
        {{ content | replace: '<img ', '<img loading="lazy" decoding="async" ' }}
      </section>
    </article>
  </main>
</div>
